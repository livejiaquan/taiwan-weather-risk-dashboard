name: Check deployment freshness

on:
  workflow_dispatch:
  schedule:
    # Independent from the Pages refresh at minutes 17 and 47.
    - cron: "11,41 * * * *"

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Probe deployed warning cache
        id: freshness-probe
        continue-on-error: true
        run: npm run probe:freshness

      - name: Request a recovery deployment
        if: steps.freshness-probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Preserve the freshness alert
        if: steps.freshness-probe.outcome == 'failure'
        run: |
          echo "The deployed cache is unhealthy; a recovery deployment was requested." >&2
          exit 1
