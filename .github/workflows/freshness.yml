name: Check deployment freshness

on:
  workflow_dispatch:
  schedule:
    # Independent from the Pages refresh at minutes 17 and 47.
    - cron: "11,41 * * * *"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Probe deployed warning cache
        run: npm run probe:freshness
