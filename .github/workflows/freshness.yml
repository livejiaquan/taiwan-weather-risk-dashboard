name: Check deployment freshness

on:
  workflow_dispatch:
  schedule:
    # Independent from the Pages refresh at minutes 17 and 47.
    - cron: "11,41 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: deployment-freshness
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Probe deployed warning cache
        id: freshness-probe
        continue-on-error: true
        run: npm run probe:freshness

      - name: Request a recovery deployment
        if: steps.freshness-probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          in_progress=$(gh run list --workflow pages.yml --status in_progress --limit 1 --json databaseId --jq 'length')
          queued=$(gh run list --workflow pages.yml --status queued --limit 1 --json databaseId --jq 'length')
          if [ $((in_progress + queued)) -gt 0 ]; then
            echo "A Pages deployment is already queued or running; skipping duplicate recovery request."
          else
            gh workflow run pages.yml --ref main
          fi

      - name: Verify freshness after recovery
        if: steps.freshness-probe.outcome == 'failure'
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            echo "Recovery verification attempt $attempt/10"
            sleep 20
            if npm run probe:freshness; then
              echo "The deployed cache recovered successfully."
              exit 0
            fi
          done
          echo "::error::The deployed cache remained unhealthy after recovery." >&2
          exit 1
